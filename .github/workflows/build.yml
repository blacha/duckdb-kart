name: Build and Release DuckDB Kart Extension

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: osx_arm64
            target: aarch64-apple-darwin
            cli_archive: duckdb_cli-osx-universal.zip
          - os: macos-14
            platform: osx_amd64
            target: x86_64-apple-darwin
            cli_archive: duckdb_cli-osx-universal.zip
          - os: ubuntu-latest
            platform: linux_amd64
            target: x86_64-unknown-linux-gnu
            cli_archive: duckdb_cli-linux-amd64.zip
          - os: windows-latest
            platform: windows_amd64
            target: x86_64-pc-windows-msvc
            cli_archive: duckdb_cli-windows-amd64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Rust Extension
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package DuckDB Extension
        shell: bash
        run: |
          python3 package.py \
            --platform ${{ matrix.platform }} \
            --target ${{ matrix.target }} \
            --duckdb-version v1.2.0 \
            --output kart.${{ matrix.platform }}.duckdb_extension

      - name: Test Load Extension (macOS & Linux)
        if: runner.os != 'Windows' && matrix.platform != 'osx_amd64'
        shell: bash
        run: |
          curl -sLO "https://github.com/duckdb/duckdb/releases/download/v1.5.5/${{ matrix.cli_archive }}"
          unzip -q ${{ matrix.cli_archive }}
          chmod +x ./duckdb
          ./duckdb -unsigned -c "LOAD './kart.${{ matrix.platform }}.duckdb_extension'; SELECT 1;"
          echo "Extension successfully loaded in DuckDB v1.5.5!"

      - name: Test Load Extension (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sLO "https://github.com/duckdb/duckdb/releases/download/v1.5.5/${{ matrix.cli_archive }}"
          unzip -q ${{ matrix.cli_archive }}
          ./duckdb.exe -unsigned -c "LOAD './kart.${{ matrix.platform }}.duckdb_extension'; SELECT 1;"
          echo "Extension successfully loaded in DuckDB v1.5.5 on Windows!"

      - name: Compress Extension (gzip)
        shell: bash
        run: |
          gzip -9 -k kart.${{ matrix.platform }}.duckdb_extension
          if [ -f kart.${{ matrix.platform }}_gcc4.duckdb_extension ]; then
            gzip -9 -k kart.${{ matrix.platform }}_gcc4.duckdb_extension
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kart-${{ matrix.platform }}
          path: |
            kart.${{ matrix.platform }}*.duckdb_extension
            kart.${{ matrix.platform }}*.duckdb_extension.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage Release Files
        run: |
          mkdir -p release-dist
          find artifacts -type f \( -name "*.duckdb_extension" -o -name "*.duckdb_extension.gz" \) -exec cp {} release-dist/ \;
          ls -lh release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
